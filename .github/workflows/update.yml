name: Update timetable and deploy

on:
  schedule:
    - cron: "17 3 * * 1,4"   # Mondays and Thursdays, 06:17 Istanbul time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape line pages
        id: scrape
        if: github.event_name != 'push'
        continue-on-error: true   # if the site is unreachable, keep the last committed timetable and still deploy
        run: python scripts/scrape.py

      - name: Build database and page
        run: |
          python scripts/site_to_lines.py
          python scripts/compare.py
          python scripts/build_db.py
          python scripts/build_html.py

      - name: Commit changed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Update timetable from sehirhatlari.istanbul ($(date -u +%F))"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
